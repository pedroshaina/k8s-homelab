# Keys of infra/secrets.sops.yaml, the one encrypted file the tf wrapper and the guide's commands
# read. Copy this file to infra/secrets.sops.yaml, fill in the values in your own terminal, then
# encrypt it in place: sops encrypt -i infra/secrets.sops.yaml (guide/01-workstation-and-repos.md).
# Never commit this file with real values.

# Proxmox API token for OpenTofu, format tofu@pve!homelab=<uuid> (guide/03-proxmox.md)
PROXMOX_VE_API_TOKEN: replace-me
# Cloudflare R2 API token for the OpenTofu state bucket (S3-compatible credentials)
AWS_ACCESS_KEY_ID: replace-me
AWS_SECRET_ACCESS_KEY: replace-me
# Encrypts the OpenTofu state; at least 16 characters (openssl rand -base64 32). Keep a copy in
# your password manager: without it the state is unreadable.
TF_VAR_state_passphrase: replace-me
# Classic GitHub token, read:packages only: the node pulls private GHCR images (guide/05-cluster.md)
GITHUB_GHCR_IMAGE_PULL_TOKEN: replace-me
# Cloudflare token (DNS edit on the zone) for the Proxmox ACME certificate (guide/03-proxmox.md)
PROXMOX_ACME_CF_TOKEN: replace-me
# Technitium admin password and the TSIG secret shared with external-dns (guide/04-dns-server.md)
TECHNITIUM_ADMIN_PASSWORD: replace-me
TSIG_EXTERNAL_DNS_SECRET: replace-me
