# https://podinfo.example.com → the podinfo Service, through the shared Gateway's team listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
spec:
  parentRefs:
    - {name: shared, namespace: gateway, sectionName: https-apps}
  hostnames:
    - podinfo.example.com
  rules:
    - backendRefs:
        - {name: podinfo, port: 9898}
