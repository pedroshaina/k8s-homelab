# external-dns Helm values. Internal records only: HTTPRoute hostnames →
# Gateway address, in dns01's internal zone. The TXT registry marks records it owns, so the
# static infrastructure records (pve01, k8s, dns01, nodes) are never changed.
provider:
  name: rfc2136
sources: [gateway-httproute]
domainFilters: [example.com]
policy: sync
registry: txt
txtOwnerId: homelab
txtPrefix: "extdns-"
interval: 1m
extraArgs:
  - --rfc2136-host=192.168.1.215
  - --rfc2136-port=53
  - --rfc2136-zone=example.com
  - --rfc2136-tsig-keyname=external-dns
  - --rfc2136-tsig-secret-alg=hmac-sha256
  - --rfc2136-tsig-axfr
  - --rfc2136-min-ttl=60s
env:
  # Secret tsig, synced from 1Password by ESO (external-secret.yaml); never inlined.
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: tsig
        key: secretValue
# Metrics
serviceMonitor:
  enabled: true
