# TSIG key for RFC 2136 updates to dns01, from 1Password: item
# external-dns-tsig, field secretValue.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tsig
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: tsig
    creationPolicy: Owner
  data:
    - secretKey: secretValue
      remoteRef:
        key: external-dns-tsig/secretValue
