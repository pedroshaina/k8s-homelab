# One wildcard for every HTTPS listener: only "*.example.com" reaches Certificate
# Transparency logs, never the internal hostnames. Renewed ~30 days before
# expiry; a new key on every renewal.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: gateway
spec:
  secretName: wildcard-tls
  dnsNames: ["*.example.com"]
  issuerRef: {kind: ClusterIssuer, name: letsencrypt}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
