# Grafana on the shared Gateway (LAN only; its own listener, https-grafana). Shipped with the
# stack (wave 3), not platform-routes (wave 2): the route never waits on a later wave's backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https-grafana
  hostnames:
    - grafana.example.com
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
