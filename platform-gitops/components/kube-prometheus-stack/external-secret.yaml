# Grafana's admin password from 1Password: item grafana-admin-password,
# field secretValue. The user name isn't secret; the template adds it so the Secret has both
# keys the chart's admin.existingSecret expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: grafana-admin-password
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .secretValue }}"
  data:
    - secretKey: secretValue
      remoteRef:
        key: grafana-admin-password/secretValue
