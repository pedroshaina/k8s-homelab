# Proxmox API config for the CSI plugin. Only the token secret comes from
# 1Password (item proxmox-csi-api-token, field secretValue); URL, token ID and region are not
# secret and live here. "|-": the plugin's config has no trailing newline.
# Concealed 1Password fields can't hold multi-line values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: config
  namespace: csi-proxmox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |-
          clusters:
            - url: https://pve01.example.com:8006/api2/json
              token_id: kubernetes-csi@pve!csi
              token_secret: {{ .secretValue }}
              region: homelab
  data:
    - secretKey: secretValue
      remoteRef:
        key: proxmox-csi-api-token/secretValue
