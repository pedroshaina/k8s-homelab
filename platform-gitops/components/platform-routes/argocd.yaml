apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https-argocd
  hostnames:
    - argocd.example.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
