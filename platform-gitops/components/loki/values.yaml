# Loki Helm values: one SingleBinary replica, single tenant, chunks and index
# on a Proxmox CSI volume. Logs are disposable (no backups). Loki indexes labels only: keep
# them few (Alloy sets them); filter everything else at query time.
deploymentMode: SingleBinary
loki:
  auth_enabled: false # single tenant: per-team Loki tenants need an identity provider
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  compactor: # without the compactor, retention_period silently does nothing
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 336h # 14 days
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    per_stream_rate_limit: 1MB # one log-spamming pod can't fill the disk
    per_stream_rate_limit_burst: 4MB
    max_query_length: 721h
    query_timeout: 1m
  ruler: # no log-based alerting
    enable_api: false
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: proxmox-lvm
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 1Gi}
# The chart defaults to a distributed install with object storage and caches: all off.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
monitoring:
  dashboards:
    enabled: true
    annotations:
      grafana_folder: Platform
  serviceMonitor:
    enabled: true
