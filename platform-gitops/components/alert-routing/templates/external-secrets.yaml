{{- $webhooks := list .Values.platformWebhook }}
{{- range (include "alert-routing.teams" . | fromYamlArray) }}{{ $webhooks = append $webhooks .alertsWebhook }}{{ end }}
{{- range $webhooks | uniq }}
---
# Discord webhook URL (a credential: anyone holding it can post), from the platform vault: item
# {{ . }}, field secretValue.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ . | quote }}
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: {{ . | quote }}
    creationPolicy: Owner
  data:
    - secretKey: secretValue
      remoteRef:
        key: {{ printf "%s/secretValue" . | quote }}
{{- end }}
