{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
# cloudflared tunnel metrics: connections, requests, errors.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    - port: metrics
{{- end }}
