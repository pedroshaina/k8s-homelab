# Tunnel credentials (cloudflared tunnel create), from 1Password: item
# cloudflared-credentials, field credentials.json — mounted as /etc/cloudflared/creds/credentials.json.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credentials
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: credentials
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef:
        key: cloudflared-credentials/credentials.json
