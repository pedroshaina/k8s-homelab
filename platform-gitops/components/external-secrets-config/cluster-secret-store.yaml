# Reads vault k8s-platform with service account k8s-platform-eso (read-only).
# Its token is secret zero (bootstrap/platform-1password-svc-acc-token.sops.yaml). Only the
# platform namespaces may use this store: a team namespace naming it is refused by ESO.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    onepasswordSDK:
      vault: k8s-platform
      auth:
        serviceAccountSecretRef:
          name: platform-svc-acc-token
          namespace: external-secrets
          key: secretValue
      cache:
        ttl: 5m
        maxSize: 100
  conditions:
    - namespaces:
        - cert-manager
        - cloudflared
        - csi-proxmox
        - external-dns
        - external-dns-public
        - external-secrets
        - monitoring
