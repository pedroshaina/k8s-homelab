# Cloudflare token for public records (Zone → DNS → Edit on example.com), from 1Password:
# item external-dns-public-cloudflare-api-token, field api-token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns-public
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: external-dns-public-cloudflare-api-token/api-token
