extends: default
ignore: |
  *.sops.yaml
  components/*/templates/
  # Vendored upstream manifests stay byte-identical (clean upgrade diffs); kubeconform checks them.
  components/kubelet-serving-cert-approver/
rules:
  document-start: disable
  line-length:
    max: 140
    level: warning
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
