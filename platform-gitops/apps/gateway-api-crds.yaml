apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before Cilium enables its Gateway controller
spec:
  project: platform
  source:
    repoURL: git@github.com:your-github-user/platform-gitops.git
    targetRevision: main
    path: components/gateway-api-crds
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false # never delete CRDs automatically: that deletes every Gateway/Route with them
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # CRDs are too large for client-side apply
