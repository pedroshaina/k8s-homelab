# AppProjects: the platform's own project and the locked default; team projects are rendered
# by components/teams. Applied at bootstrap before root
# (root is itself in "platform"), then managed by root. Wave -2: before every Application except
# the operator CRDs (same wave, no dependency between them).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Cluster platform, from platform-gitops
  sourceRepos:
    - git@github.com:your-github-user/platform-gitops.git
    - git@github.com:your-github-user/k8s-homelab.git # Cilium bootstrap base values only
    - https://argoproj.github.io/argo-helm
    - https://helm.cilium.io
    - https://charts.jetstack.io
    - ghcr.io/sergelogvinov/charts
    - https://kubernetes-sigs.github.io/external-dns/
    - https://charts.external-secrets.io
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://kubernetes-sigs.github.io/metrics-server/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
# Argo CD's built-in project, emptied so nothing can fall back into it unfenced.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
