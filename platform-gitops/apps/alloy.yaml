# Alloy: two releases of one chart — "alloy" (pod logs, DaemonSet) and
# "alloy-events" (Kubernetes Events, one replica) — pushing to Loki. Wave 3 with Loki; Alloy
# retries until Loki is up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/components/alloy/values.yaml
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0
      helm:
        releaseName: alloy-events
        valueFiles:
          - $values/components/alloy-events/values.yaml
    - repoURL: git@github.com:your-github-user/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry: # namespace monitoring comes from kube-prometheus-stack, same wave: wait for it on a rebuild
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
