# Global alert routing: renders components/alert-routing with the team
# onboarding file — Alertmanager's one AlertmanagerConfig and the webhook ExternalSecrets.
# Wave 3, with kube-prometheus-stack: the operator waits for this config before configuring
# Alertmanager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alert-routing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: git@github.com:your-github-user/platform-gitops.git
      targetRevision: main
      path: components/alert-routing
      helm:
        valueFiles:
          - values.yaml
          - $values/components/teams/values.yaml
    - repoURL: git@github.com:your-github-user/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry: # namespace monitoring comes from kube-prometheus-stack, same wave: wait for it on a rebuild
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
