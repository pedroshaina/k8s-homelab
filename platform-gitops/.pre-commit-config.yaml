# Checks that run on every commit (and in CI via `pre-commit run --all-files`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^components/[^/]+/templates/ # Helm templates are YAML only after rendering

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: sops-encrypted
        name: SOPS files are encrypted
        entry: scripts/check-sops-encrypted.sh
        language: script
        files: \.sops\.ya?ml$
        exclude: (^|/)\.sops\.yaml$ # the SOPS rules file itself (public key only)

      # kubeconform on every Kubernetes manifest (tools, not scripts). The CRD
      # catalog is pinned to a commit: schema changes arrive as reviewed bumps. Not Kubernetes
      # objects, so excluded: Helm values and local charts, kustomizations, promtool tests, SOPS files.
      - id: kubeconform
        name: Kubernetes manifests are valid (kubeconform)
        entry: >-
          kubeconform -strict -summary -schema-location default
          -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/f1e7f6bc0537bf0622ffe6e47dbaa85914fabbec/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        language: system
        files: ^(apps|components|bootstrap)/.*\.yaml$
        exclude: (\.sops\.yaml|\.test\.yaml|(^|/)(values|kustomization|Chart)\.yaml|/templates/)
