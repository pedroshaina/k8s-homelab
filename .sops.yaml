# SOPS encryption rules. Any file named *.sops.yaml is encrypted to this age public key.
# Replace it with your own public key (guide/01-workstation-and-repos.md). Public keys are safe to
# commit; the private key lives in ~/.config/sops/age/keys.txt.
creation_rules:
  - path_regex: \.sops\.ya?ml$
    age: age1replace-with-your-public-key
