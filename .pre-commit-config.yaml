# Checks that run on every commit (after `pre-commit install`), or on demand with `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        # The copied repos carry their own config (Helm templates, vendored manifests).
        exclude: ^(platform-gitops|apps-gitops|app-template)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^(platform-gitops|apps-gitops|app-template)/

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      # Hook ids say "terraform", but --tf-path makes them run OpenTofu.
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
          - --hook-config=--retry-once-with-cleanup=true
          # validate never touches state; a dummy satisfies the encryption block's variable
          - --env-vars=TF_VAR_state_passphrase=0000000000000000

  - repo: local
    hooks:
      - id: sops-encrypted
        name: SOPS files are encrypted
        entry: scripts/check-sops-encrypted.sh
        language: script
        files: \.sops\.ya?ml$
        exclude: (^|/)\.sops\.yaml$ # the SOPS rules file itself (public key only)
